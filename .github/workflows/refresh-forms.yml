name: Refresh form catalogs

on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:

concurrency:
  group: form-refresh
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch, test, and open PR or issues
        run: npx --yes tsx@4.20.6 --tsconfig tsconfig.scripts.json scripts/refresh-forms.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
